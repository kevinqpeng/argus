<g><rect x="960" y="282" width="270" height="100" rx="15" fill="white" stroke="#d4dbe5" stroke-width="1.5"/><circle cx="987" cy="311" r="14" fill="#eeeaff"/><text x="987" y="316" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#6044f5">08</text><text x="1010" y="318" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#172033">报告与交付</text><text x="982" y="354" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="13" fill="#657085">覆盖率 · 结论 · 证据</text></g>
<text x="48" y="458" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="14" fill="#657085">缺陷修复回归可复用原有场景与证据；专项测试按选定范围执行。</text></svg>
